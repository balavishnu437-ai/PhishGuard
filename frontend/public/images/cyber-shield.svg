<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="50%" stop-color="#11183c" />
      <stop offset="100%" stop-color="#070a1a" />
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="24" />

  <!-- Multi-color glowing ambient orbs -->
  <circle cx="250" cy="200" r="140" fill="#a855f7" opacity="0.18" filter="url(#superGlow)" />
  <circle cx="550" cy="350" r="160" fill="#00f0ff" opacity="0.22" filter="url(#superGlow)" />
  <circle cx="400" cy="480" r="120" fill="#ec4899" opacity="0.15" filter="url(#superGlow)" />

  <!-- Digital Grid Pattern -->
  <g stroke="rgba(125, 180, 255, 0.07)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
  </g>

  <!-- Holographic Concentric Radar Rings -->
  <circle cx="400" cy="300" r="230" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-dasharray="8 8" stroke-width="1.5" />
  <circle cx="400" cy="300" r="180" fill="none" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1" />
  <circle cx="400" cy="300" r="130" fill="none" stroke="rgba(236, 72, 153, 0.25)" stroke-dasharray="6 4" stroke-width="1.5" />

  <!-- Futuristic Shield Crest Outer Aura -->
  <path d="M400 110 L540 170 C540 330 460 430 400 480 C340 430 260 330 260 170 Z" 
        fill="none" stroke="url(#shieldGradient)" stroke-width="6" filter="url(#glow)" />

  <!-- Shield Body Surface with Glassmorphic Fill -->
  <path d="M400 120 L530 176 C530 320 455 418 400 465 C345 418 270 320 270 176 Z" 
        fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />

  <!-- Inner Cyber Circuit Vectors -->
  <path d="M400 160 L400 420 M330 240 L470 240 M310 320 L490 320" 
        stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Central Glowing Checkmark Emblem -->
  <path d="M340 290 L380 335 L470 235" 
        fill="none" stroke="url(#neonCyan)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Cyber Node Points with Multi-Color Glints -->
  <circle cx="400" cy="120" r="6" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="530" cy="176" r="6" fill="#a855f7" filter="url(#glow)" />
  <circle cx="270" cy="176" r="6" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="400" cy="465" r="7" fill="#ec4899" filter="url(#glow)" />
  <circle cx="340" cy="290" r="5" fill="#34d399" filter="url(#glow)" />
  <circle cx="470" cy="235" r="6" fill="#00f0ff" filter="url(#glow)" />

  <!-- Floating Metric Overlay Badges -->
  <g transform="translate(110, 140)">
    <rect width="180" height="52" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 240, 255, 0.4)" />
    <circle cx="26" cy="26" r="8" fill="#10b981" />
    <text x="44" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">ML ACCURACY</text>
    <text x="44" y="40" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">97.4%</text>
  </g>

  <g transform="translate(520, 390)">
    <rect width="180" height="52" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(236, 72, 153, 0.4)" />
    <circle cx="26" cy="26" r="8" fill="#ec4899" />
    <text x="44" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="1">LATENCY BOUND</text>
    <text x="44" y="40" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">&lt; 85 ms</text>
  </g>
</svg>
