<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="40%" stop-color="#0b112c" />
      <stop offset="70%" stop-color="#100b28" />
      <stop offset="100%" stop-color="#040714" />
    </linearGradient>

    <!-- Multi-Color Aurora Gradients -->
    <radialGradient id="auroraCyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.08" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraPurple" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraPink" cx="50%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#db2777" stop-opacity="0.07" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="auroraEmerald" cx="10%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>

    <!-- Honeycomb Pattern -->
    <pattern id="hexPattern" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(0.8)">
      <path d="M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z M28 97 L56 81 L56 49 L28 33 L0 49 L0 81 Z" 
            fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1" />
    </pattern>

    <!-- Circuit Trace Gradient -->
    <linearGradient id="traceGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <linearGradient id="traceGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="100%" height="100%" fill="url(#bgGradFull)" />

  <!-- Multi-Color Ambient Aurora Light Fields -->
  <rect width="100%" height="100%" fill="url(#auroraCyan)" />
  <rect width="100%" height="100%" fill="url(#auroraPurple)" />
  <rect width="100%" height="100%" fill="url(#auroraPink)" />
  <rect width="100%" height="100%" fill="url(#auroraEmerald)" />

  <!-- Hexagonal Honeycomb Cyber Shield Layer -->
  <rect width="100%" height="100%" fill="url(#hexPattern)" opacity="0.65" />

  <!-- 3D Perspective Digital Horizon Grid (Top & Bottom) -->
  <g stroke="rgba(99, 161, 255, 0.12)" stroke-width="1.2">
    <!-- Horizontal Perspective Lines -->
    <line x1="0" y1="80" x2="1920" y2="80" opacity="0.3" />
    <line x1="0" y1="160" x2="1920" y2="160" opacity="0.4" />
    <line x1="0" y1="260" x2="1920" y2="260" opacity="0.6" />
    <line x1="0" y1="820" x2="1920" y2="820" opacity="0.6" />
    <line x1="0" y1="920" x2="1920" y2="920" opacity="0.4" />
    <line x1="0" y1="1000" x2="1920" y2="1000" opacity="0.3" />

    <!-- Vanishing Perspective Beams (Converging to Center) -->
    <line x1="100" y1="0" x2="700" y2="540" opacity="0.25" />
    <line x1="350" y1="0" x2="780" y2="540" opacity="0.25" />
    <line x1="600" y1="0" x2="860" y2="540" opacity="0.25" />
    <line x1="1320" y1="0" x2="1060" y2="540" opacity="0.25" />
    <line x1="1570" y1="0" x2="1140" y2="540" opacity="0.25" />
    <line x1="1820" y1="0" x2="1220" y2="540" opacity="0.25" />

    <line x1="100" y1="1080" x2="700" y2="540" opacity="0.25" />
    <line x1="350" y1="1080" x2="780" y2="540" opacity="0.25" />
    <line x1="600" y1="1080" x2="860" y2="540" opacity="0.25" />
    <line x1="1320" y1="1080" x2="1060" y2="540" opacity="0.25" />
    <line x1="1570" y1="1080" x2="1140" y2="540" opacity="0.25" />
    <line x1="1820" y1="1080" x2="1220" y2="540" opacity="0.25" />
  </g>

  <!-- Glowing Cyber Circuit Board Branches -->
  <g fill="none" stroke-width="2" filter="url(#softGlow)" opacity="0.55">
    <!-- Left Wing Circuits -->
    <path d="M 0 320 L 280 320 L 360 400 L 520 400 L 580 460" stroke="url(#traceGrad1)" />
    <circle cx="280" cy="320" r="4" fill="#00f0ff" />
    <circle cx="360" cy="400" r="4" fill="#a855f7" />
    <circle cx="580" cy="460" r="5" fill="#34d399" />

    <path d="M 120 0 L 120 220 L 200 300 L 320 300" stroke="url(#traceGrad1)" />
    <circle cx="200" cy="300" r="4" fill="#00f0ff" />
    <circle cx="320" cy="300" r="5" fill="#a855f7" />

    <path d="M 0 680 L 220 680 L 300 600 L 460 600" stroke="url(#traceGrad1)" />
    <circle cx="220" cy="680" r="4" fill="#10b981" />
    <circle cx="300" cy="600" r="4" fill="#06b6d4" />
    <circle cx="460" cy="600" r="5" fill="#00f0ff" />

    <!-- Right Wing Circuits -->
    <path d="M 1920 360 L 1640 360 L 1560 280 L 1400 280 L 1340 220" stroke="url(#traceGrad2)" />
    <circle cx="1640" cy="360" r="4" fill="#ec4899" />
    <circle cx="1560" cy="280" r="4" fill="#8b5cf6" />
    <circle cx="1340" cy="220" r="5" fill="#00f0ff" />

    <path d="M 1800 0 L 1800 180 L 1720 260 L 1580 260" stroke="url(#traceGrad2)" />
    <circle cx="1720" cy="260" r="4" fill="#ec4899" />
    <circle cx="1580" cy="260" r="5" fill="#a855f7" />

    <path d="M 1920 720 L 1700 720 L 1620 800 L 1460 800" stroke="url(#traceGrad2)" />
    <circle cx="1700" cy="720" r="4" fill="#a855f7" />
    <circle cx="1620" cy="800" r="4" fill="#ec4899" />
    <circle cx="1460" cy="800" r="5" fill="#06b6d4" />
  </g>

  <!-- Global Cyber Security Telemetry Nodes (World Arcs) -->
  <g stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.2" fill="none" opacity="0.6">
    <path d="M 380 480 Q 960 200 1540 460" stroke-dasharray="6 6" />
    <path d="M 500 360 Q 960 140 1420 340" stroke-dasharray="4 4" stroke="rgba(168, 85, 247, 0.3)" />
    <path d="M 440 620 Q 960 780 1480 600" stroke-dasharray="6 6" stroke="rgba(236, 72, 153, 0.25)" />
  </g>

  <!-- Glowing Telemetry Intercept Nodes -->
  <g filter="url(#neonGlow)">
    <circle cx="380" cy="480" r="6" fill="#00f0ff" />
    <circle cx="1540" cy="460" r="6" fill="#ec4899" />
    <circle cx="500" cy="360" r="5" fill="#a855f7" />
    <circle cx="1420" cy="340" r="6" fill="#10b981" />
    <circle cx="960" cy="270" r="7" fill="#00f0ff" />
    <circle cx="960" cy="690" r="6" fill="#f59e0b" />
  </g>

  <!-- Ambient Holographic Security Matrix Particles & Crosshairs -->
  <g fill="rgba(0, 240, 255, 0.4)" font-family="monospace" font-size="11">
    <text x="140" y="240" opacity="0.5">+ SEC_AUTH_TOKEN: 0x8F94B2</text>
    <text x="140" y="260" opacity="0.4">TLS_AES_256_GCM_SHA384</text>
    <text x="140" y="280" opacity="0.3">NEURAL_WEIGHTS: PHIUSIIL_V2</text>

    <text x="1480" y="220" opacity="0.5">HEURISTIC_SCORE: OPTIMAL</text>
    <text x="1480" y="240" opacity="0.4">AiTM_PROXY_SHIELD: ACTIVE</text>
    <text x="1480" y="260" opacity="0.3">LATENCY_SYNC: &lt;85ms</text>

    <!-- Crosshairs -->
    <path d="M 300 180 L 320 180 M 310 170 L 310 190" stroke="rgba(0, 240, 255, 0.5)" stroke-width="1.5" />
    <path d="M 1600 160 L 1620 160 M 1610 150 L 1610 170" stroke="rgba(168, 85, 247, 0.5)" stroke-width="1.5" />
    <path d="M 240 820 L 260 820 M 250 810 L 250 830" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5" />
    <path d="M 1680 840 L 1700 840 M 1690 830 L 1690 850" stroke="rgba(236, 72, 153, 0.5)" stroke-width="1.5" />
  </g>
</svg>
