<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="neuralBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b1a" />
      <stop offset="60%" stop-color="#101936" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>
    <linearGradient id="wireGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#neuralBg)" rx="24" />

  <!-- Multi-color glowing blur spots -->
  <circle cx="200" cy="300" r="160" fill="#a855f7" opacity="0.2" filter="url(#glow2)" />
  <circle cx="600" cy="250" r="150" fill="#06b6d4" opacity="0.22" filter="url(#glow2)" />
  <circle cx="400" cy="450" r="130" fill="#ec4899" opacity="0.18" filter="url(#glow2)" />

  <!-- Interconnected Neural Nodes and Synapses -->
  <g stroke="url(#wireGradient)" stroke-width="2" opacity="0.65">
    <!-- Layer 1 to Layer 2 -->
    <line x1="160" y1="180" x2="320" y2="150" />
    <line x1="160" y1="180" x2="320" y2="270" />
    <line x1="160" y1="300" x2="320" y2="150" />
    <line x1="160" y1="300" x2="320" y2="270" />
    <line x1="160" y1="300" x2="320" y2="390" />
    <line x1="160" y1="420" x2="320" y2="270" />
    <line x1="160" y1="420" x2="320" y2="390" />

    <!-- Layer 2 to Layer 3 -->
    <line x1="320" y1="150" x2="480" y2="200" />
    <line x1="320" y1="270" x2="480" y2="200" />
    <line x1="320" y1="270" x2="480" y2="340" />
    <line x1="320" y1="390" x2="480" y2="340" />

    <!-- Layer 3 to Output -->
    <line x1="480" y1="200" x2="640" y2="270" stroke="#00f0ff" stroke-width="3" />
    <line x1="480" y1="340" x2="640" y2="270" stroke="#a855f7" stroke-width="3" />
  </g>

  <!-- Glowing Nodes -->
  <!-- Inputs -->
  <circle cx="160" cy="180" r="10" fill="#00f0ff" filter="url(#glow2)" />
  <text x="160" y="155" fill="#38bdf8" font-size="11" text-anchor="middle" font-family="monospace">TLD &amp; Entropy</text>

  <circle cx="160" cy="300" r="10" fill="#a855f7" filter="url(#glow2)" />
  <text x="160" y="328" fill="#c084fc" font-size="11" text-anchor="middle" font-family="monospace">51 Lexical Signals</text>

  <circle cx="160" cy="420" r="10" fill="#ec4899" filter="url(#glow2)" />
  <text x="160" y="450" fill="#f472b6" font-size="11" text-anchor="middle" font-family="monospace">DOM &amp; Form Actions</text>

  <!-- Hidden Layer 1 -->
  <circle cx="320" cy="150" r="12" fill="#3b82f6" filter="url(#glow2)" />
  <circle cx="320" cy="270" r="14" fill="#8b5cf6" filter="url(#glow2)" />
  <circle cx="320" cy="390" r="12" fill="#ec4899" filter="url(#glow2)" />

  <!-- Hidden Layer 2 -->
  <circle cx="480" cy="200" r="14" fill="#06b6d4" filter="url(#glow2)" />
  <circle cx="480" cy="340" r="14" fill="#a855f7" filter="url(#glow2)" />

  <!-- Output Decision Core -->
  <circle cx="640" cy="270" r="26" fill="#10b981" filter="url(#glow2)" />
  <circle cx="640" cy="270" r="38" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" />
  <text x="640" y="275" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">VERDICT</text>
  <text x="640" y="330" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle" font-family="monospace">SAFE / 0–100 RISK</text>

  <!-- Floating Telemetry Card -->
  <g transform="translate(240, 480)">
    <rect width="320" height="58" rx="14" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(0, 240, 255, 0.3)" />
    <text x="20" y="26" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif">PhiUSIIL Benchmark Trained</text>
    <text x="20" y="44" fill="#94a3b8" font-size="11" font-family="sans-serif">CART Decision Tree · 51 Multi-Dimensional Features</text>
  </g>
</svg>
